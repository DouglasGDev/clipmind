<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipMind - Editor de Vídeo com IA</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">🎬</span>
            <div>
                <h1>ClipMind</h1>
                <p>Editor de vídeo com IA local</p>
            </div>
        </div>
        <div class="topbar-actions">
            <a href="/editor" class="btn btn-ghost">Editor profissional</a>
            <button id="agent-status" class="status" type="button">Verificando IA...</button>
            <button id="btn-new-chat" class="btn btn-ghost" type="button">Nova conversa</button>
        </div>
    </header>

    <main class="layout">
        <section class="column column-video">
            <div class="card">
                <div id="upload-area" class="upload-area">
                    <div class="upload-icon">📹</div>
                    <p>Arraste um vídeo ou selecione um arquivo</p>
                    <input type="file" id="video-input" accept="video/*" hidden>
                    <button class="btn btn-primary" id="btn-pick-video" type="button">Selecionar vídeo</button>
                </div>

                <div id="video-preview" class="video-preview" hidden>
                    <video id="video-player" controls preload="metadata"></video>
                    <div class="video-meta">
                        <span id="video-name" class="video-name"></span>
                        <button class="btn btn-small btn-ghost" id="btn-change-video" type="button">Trocar</button>
                    </div>
                </div>

                <div id="timeline" class="timeline" hidden>
                    <div class="timeline-fields">
                        <label class="mini-field">Início
                            <input type="text" id="cut-start" value="00:00:00" placeholder="00:00:00">
                        </label>
                        <label class="mini-field">Fim
                            <input type="text" id="cut-end" placeholder="00:00:00">
                        </label>
                        <button class="btn btn-small" type="button" onclick="setCutPoint('start')">Marcar início</button>
                        <button class="btn btn-small" type="button" onclick="setCutPoint('end')">Marcar fim</button>
                    </div>
                    <div class="timeline-bar" id="timeline-bar">
                        <div class="timeline-progress" id="timeline-progress"></div>
                    </div>
                    <div class="timeline-times">
                        <span id="current-time">00:00:00</span>
                        <span id="total-time">00:00:00</span>
                    </div>
                </div>
            </div>

            <div class="card chat-card">
                <div class="card-header">
                    <h2>IA</h2>
                    <span class="muted" id="chat-state">pronta</span>
                </div>
                <div id="chat-messages" class="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="ai-command" placeholder="Ex: corte de 00:01:00 até 00:03:00" autocomplete="off">
                    <button class="btn btn-primary" id="btn-send" type="button">Enviar</button>
                </div>
            </div>

            <div class="card" id="video-info-card" hidden>
                <div class="card-header">
                    <h2>Informações</h2>
                </div>
                <dl id="video-info" class="info-grid"></dl>
            </div>
        </section>

        <section class="column column-tools">
            <div class="card">
                <div class="card-header">
                    <h2>Ferramentas</h2>
                    <span class="muted" id="tool-count"></span>
                </div>
                <div id="tool-list" class="tool-list"></div>
            </div>

            <div class="card tool-form-card" id="tool-form-card" hidden>
                <div class="card-header">
                    <h2 id="tool-form-title">Ferramenta</h2>
                    <button class="icon-btn" id="btn-close-form" type="button" aria-label="Fechar">✕</button>
                </div>
                <form id="tool-form" class="tool-form"></form>
                <div id="tool-result" class="tool-result" hidden></div>
            </div>
        </section>
    </main>

    <section class="card results-card">
        <div class="card-header">
            <h2>Resultados</h2>
            <div class="header-buttons">
                <button class="btn btn-small btn-ghost" id="btn-more-results" type="button" hidden>Mostrar mais</button>
                <button class="btn btn-small btn-ghost" id="btn-refresh-results" type="button">Atualizar</button>
            </div>
        </div>
        <div id="results-empty" class="empty-state">Nenhum arquivo gerado ainda.</div>
        <div id="results-grid" class="results-grid"></div>
    </section>

    <div id="progress" class="progress" hidden>
        <span class="spinner"></span>
        <span id="progress-text">Processando...</span>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/static/app.js"></script>
</body>
</html>
